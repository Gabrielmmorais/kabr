name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned tool versions. Bump deliberately, never float to "latest".
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  # controller-gen, setup-envtest and the envtest Kubernetes version are
  # pinned in the Makefile (CONTROLLER_GEN_VERSION, SETUP_ENVTEST_VERSION,
  # ENVTEST_K8S_VERSION); the jobs below call make so there is one source.
  # kubectl of the e2e job: the minor of the kind node image (KIND_NODE_IMAGE
  # in the Makefile), verified against its published SHA-256.
  KUBECTL_VERSION: v1.37.0
  KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
          go vet -tags llm_live ./...
          go vet -tags envtest ./...
          go vet -tags e2e ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      # DeepCopy code, CRDs and RBAC are generated from the Go types and
      # markers and committed; fail when they are stale.
      - name: Generated code and manifests are up to date
        run: |
          make generate manifests
          git diff --exit-code
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "Generated files are not committed:"
            echo "$untracked"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test -race -count=1 ./...

      # Integration tests start real databases with testcontainers-go.
      # GitHub-hosted ubuntu runners ship a working Docker daemon.
      - name: Integration tests
        run: go test -race -count=1 -tags integration ./...

      # Graph-only plan scored against the gold standard: no LLM call, no
      # credentials. Fails if the plan and the gold cover different tables
      # or the planner regression floors are crossed.
      - name: Eval (Pagila, graph-only)
        run: make eval-pagila

  envtest:
    name: Envtest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Starts a real kube-apiserver and etcd (setup-envtest downloads them
      # into bin/envtest) and runs the `envtest`-tagged suites: the CRDs
      # must keep an approved plan verifiable and reject invalid objects.
      - name: Envtest (kube-apiserver + etcd)
        run: make envtest

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  e2e:
    name: E2E (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned kubectl (linux/amd64, the hosted runner's architecture),
      # installed into bin/ (gitignored) instead of the runner's floating one.
      - name: Install kubectl
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin/tools"
          curl -fsSL --retry 3 -o "$GITHUB_WORKSPACE/bin/tools/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $GITHUB_WORKSPACE/bin/tools/kubectl" | sha256sum -c -
          chmod 0755 "$GITHUB_WORKSPACE/bin/tools/kubectl"
          echo "$GITHUB_WORKSPACE/bin/tools" >> "$GITHUB_PATH"

      # kind (run through `go run`, pinned in the Makefile) on the runner's
      # Docker; the Makefile fetches and verifies Pagila, builds both images,
      # deploys the operator and the approved plan, then runs test/e2e
      # (including the fail-closed and masking-persistence checks). kind and
      # kubectl only ever use bin/kind-kabr.kubeconfig with --context kind-kabr.
      - name: make e2e
        run: make e2e

      - name: Diagnostics
        if: failure()
        run: make e2e-diagnostics

      - name: Delete the kind cluster
        if: always()
        run: make e2e-down
