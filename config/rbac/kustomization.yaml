# RBAC of the Kabr operator.
# role.yaml (ClusterRole kabr-operator) is generated by "make manifests" from
# the +kubebuilder:rbac markers in internal/controller; do not edit it.
# Secrets: "get" only, used for the DataSource key check through an uncached
# read; no list/watch (Secrets are not watched or cached; DataSources re-check
# them periodically) and never create/update. The operator never puts Secret
# values into logs, status, events or ConfigMaps.
#
# NOTE: role.yaml is a ClusterRole, so it grants "get" on Secrets in EVERY
# namespace (plus write access to ConfigMaps, Services, Deployments and
# NetworkPolicies cluster-wide). A namespaced mode (a Role per watched
# namespace, used with --watch-namespace) is backlog for M4; until then, treat
# the operator's ServiceAccount as able to read any Secret by name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service_account.yaml
  - role.yaml
  - role_binding.yaml
  - leader_election_role.yaml
  - leader_election_role_binding.yaml
