---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: domainapis.kabr.dev
spec:
  group: kabr.dev
  names:
    categories:
    - kabr
    kind: DomainAPI
    listKind: DomainAPIList
    plural: domainapis
    shortNames:
    - kapi
    singular: domainapi
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.domain
      name: Domain
      type: string
    - jsonPath: .spec.planRef.name
      name: Plan
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.url
      name: URL
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DomainAPI is one REST API serving one domain of an approved DomainPlan.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DomainAPISpec is one domain of an approved DomainPlan, served as one REST
              API. The operator creates it from the DomainPlan; the tables and sensitive
              columns are copied from the plan's domain.
            properties:
              catalogFingerprint:
                description: |-
                  CatalogFingerprint is the plan's catalog fingerprint; the API refuses
                  to serve a database whose catalog no longer matches it.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              dataSourceRef:
                description: DataSourceRef names the DataSource (same namespace) to
                  read from.
                properties:
                  name:
                    description: Name of the referenced object (a DNS-1123 subdomain).
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              domain:
                description: Domain is the name of the domain in the plan (a DNS-1123
                  label).
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              image:
                description: Image overrides the container image of the API server.
                maxLength: 512
                type: string
              planRef:
                description: PlanRef names the DomainPlan (same namespace) the domain
                  comes from.
                properties:
                  name:
                    description: Name of the referenced object (a DNS-1123 subdomain).
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              replicas:
                default: 1
                description: |-
                  Replicas is the number of API pods. Zero is a valid value (scaled
                  down), so the field is always serialized; an omitted field defaults
                  to 1.
                format: int32
                maximum: 10
                minimum: 0
                type: integer
              rowLimit:
                default: 100
                description: RowLimit is the maximum number of rows a list request
                  returns.
                format: int32
                maximum: 1000
                minimum: 1
                type: integer
              sensitiveColumns:
                description: |-
                  SensitiveColumns are the columns of these tables that must not be
                  exposed verbatim, with the action to apply (mask, drop or hash).
                items:
                  description: SensitiveColumn flags one column that must not be exposed
                    verbatim.
                  properties:
                    action:
                      description: |-
                        Action is what the generated API does with the column: mask, drop or
                        hash.
                      enum:
                      - mask
                      - drop
                      - hash
                      type: string
                    class:
                      description: 'Class classifies the column: pii, credential,
                        financial or other.'
                      enum:
                      - pii
                      - credential
                      - financial
                      - other
                      type: string
                    column:
                      description: Column is the column name.
                      minLength: 1
                      type: string
                    rationale:
                      description: Rationale explains why the column is sensitive.
                      type: string
                    source:
                      description: Source is one of SourceHeuristic, SourceLLM, SourceHuman
                        or empty.
                      enum:
                      - heuristic
                      - llm
                      - human
                      type: string
                    table:
                      description: Table is the table ID "schema.table".
                      pattern: ^[^.]*\S[^.]*\..*\S.*$
                      type: string
                  required:
                  - action
                  - class
                  - column
                  - table
                  type: object
                type: array
              tables:
                description: Tables are the table IDs ("schema.table") the API serves.
                items:
                  pattern: ^[^.]*\S[^.]*\..*\S.*$
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
            required:
            - catalogFingerprint
            - dataSourceRef
            - domain
            - planRef
            - tables
            type: object
          status:
            description: DomainAPIStatus is the observed state of a DomainAPI.
            properties:
              conditions:
                description: Conditions describe the state of the API (for example
                  Ready).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation last reconciled.
                format: int64
                type: integer
              readyReplicas:
                description: ReadyReplicas is the number of API pods ready to serve.
                format: int32
                type: integer
              serviceName:
                description: ServiceName is the name of the Service in front of the
                  API pods.
                type: string
              url:
                description: URL is the in-cluster base URL of the API.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
