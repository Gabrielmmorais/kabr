---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: domainplans.kabr.dev
spec:
  group: kabr.dev
  names:
    categories:
    - kabr
    kind: DomainPlan
    listKind: DomainPlanList
    plural: domainplans
    shortNames:
    - kdp
    singular: domainplan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.dataSourceRef.name
      name: DataSource
      type: string
    - jsonPath: .spec.approval.approvedBy
      name: Approved By
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DomainPlan is an approved Kabr domain plan: the grouping of the tables of
          one database into domains, each of which the operator serves as one REST
          API through a DomainAPI. Create it with "kabr plan manifest".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DomainPlanSpec is an approved domain plan bound to a data source.

              The plan itself (source catalog and domains) is the pkg/plan spec,
              embedded inline and unchanged: the same Go type, the same JSON fields. The
              operator rebuilds a plan with [DomainPlan.ToPlan] and re-checks it with
              plan.VerifyApproval, so a spec edited in the cluster after approval is
              detected exactly like an edited YAML file.
            properties:
              approval:
                description: |-
                  Approval records who approved the plan, when, and the digest of the
                  approved spec (plan.SpecDigest). The operator serves nothing for a
                  plan without a valid approval.
                properties:
                  approvedAt:
                    description: ApprovedAt is when the plan was approved (UTC, whole
                      seconds).
                    format: date-time
                    type: string
                  approvedBy:
                    description: ApprovedBy is who approved the plan.
                    minLength: 1
                    type: string
                  digest:
                    description: Digest is plan.SpecDigest of the approved spec.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                required:
                - approvedAt
                - approvedBy
                - digest
                type: object
              dataSourceRef:
                description: |-
                  DataSourceRef names the DataSource (same namespace) the APIs of this
                  plan read from.
                properties:
                  name:
                    description: Name of the referenced object (a DNS-1123 subdomain).
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              domains:
                description: Domains are the groups of tables; each one becomes one
                  API.
                items:
                  description: Domain is one group of tables that will become one
                    API.
                  properties:
                    description:
                      description: Description is a short human-readable summary of
                        the domain.
                      type: string
                    name:
                      description: Name is a DNS-1123 label, unique within the plan.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    rationale:
                      description: Rationale explains why these tables were grouped
                        together.
                      type: string
                    sensitiveColumns:
                      description: |-
                        SensitiveColumns are the columns of the domain's tables that must not
                        be exposed verbatim.
                      items:
                        description: SensitiveColumn flags one column that must not
                          be exposed verbatim.
                        properties:
                          action:
                            description: |-
                              Action is what the generated API does with the column: mask, drop or
                              hash.
                            enum:
                            - mask
                            - drop
                            - hash
                            type: string
                          class:
                            description: 'Class classifies the column: pii, credential,
                              financial or other.'
                            enum:
                            - pii
                            - credential
                            - financial
                            - other
                            type: string
                          column:
                            description: Column is the column name.
                            minLength: 1
                            type: string
                          rationale:
                            description: Rationale explains why the column is sensitive.
                            type: string
                          source:
                            description: Source is one of SourceHeuristic, SourceLLM,
                              SourceHuman or empty.
                            enum:
                            - heuristic
                            - llm
                            - human
                            type: string
                          table:
                            description: Table is the table ID "schema.table".
                            pattern: ^[^.]*\S[^.]*\..*\S.*$
                            type: string
                        required:
                        - action
                        - class
                        - column
                        - table
                        type: object
                      type: array
                    tables:
                      description: Tables are the tables of the domain; a table belongs
                        to one domain.
                      items:
                        description: TableAssignment places one table in a domain.
                        properties:
                          name:
                            description: Name is the table ID "schema.table" (see
                              schema.TableID).
                            pattern: ^[^.]*\S[^.]*\..*\S.*$
                            type: string
                          rationale:
                            description: Rationale explains why the table was placed
                              in this domain.
                            type: string
                          role:
                            description: Role is one of RoleCore, RoleLookup, RoleJunction,
                              RoleOrphan or empty.
                            enum:
                            - core
                            - lookup
                            - junction
                            - orphan
                            type: string
                          shared:
                            description: Shared marks a table that other domains also
                              read (e.g. a lookup).
                            type: boolean
                        required:
                        - name
                        type: object
                      minItems: 1
                      type: array
                  required:
                  - name
                  - tables
                  type: object
                minItems: 1
                type: array
              replicas:
                default: 1
                description: Replicas is the default number of pods of each generated
                  API.
                format: int32
                maximum: 10
                minimum: 0
                type: integer
              rowLimit:
                default: 100
                description: |-
                  RowLimit is the default maximum number of rows a list request of the
                  generated APIs returns.
                format: int32
                maximum: 1000
                minimum: 1
                type: integer
              source:
                description: Source identifies the catalog the plan was generated
                  for.
                properties:
                  catalogFingerprint:
                    description: CatalogFingerprint is [Fingerprint] of the catalog
                      ("sha256:<hex>").
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  database:
                    description: Database is the name of the database the catalog
                      was read from.
                    minLength: 1
                    type: string
                  dialect:
                    description: Dialect is the database dialect of the catalog (for
                      example postgres).
                    minLength: 1
                    type: string
                  schemaVersion:
                    description: SchemaVersion is the version of the catalog document
                      format.
                    type: string
                required:
                - catalogFingerprint
                - database
                - dialect
                - schemaVersion
                type: object
            required:
            - dataSourceRef
            - domains
            - source
            type: object
          status:
            description: DomainPlanStatus is the observed state of a DomainPlan.
            properties:
              conditions:
                description: Conditions describe the state of the plan (for example
                  Ready).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              domainAPIs:
                description: |-
                  DomainAPIs are the names of the DomainAPI objects created for the
                  domains of this plan.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              observedGeneration:
                description: ObservedGeneration is the metadata.generation last reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
