---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: datasources.kabr.dev
spec:
  group: kabr.dev
  names:
    categories:
    - kabr
    kind: DataSource
    listKind: DataSourceList
    plural: datasources
    shortNames:
    - kds
    singular: datasource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.driver
      name: Driver
      type: string
    - jsonPath: .spec.secretRef.name
      name: Secret
      type: string
    - jsonPath: .spec.network.port
      name: Port
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DataSource describes how Kabr's generated APIs reach one database
          read-only.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DataSourceSpec describes how the generated APIs reach one
              database.
            properties:
              driver:
                description: Driver is the database driver.
                enum:
                - postgres
                type: string
              hashKeySecretRef:
                description: |-
                  HashKeySecretRef points to a Secret in the same namespace that holds
                  the HMAC key used for sensitive columns whose action is "hash".
                  Required by the operator only when a plan uses that action.
                properties:
                  key:
                    default: key
                    description: Key of the Secret's data that holds the HMAC key.
                    maxLength: 253
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  name:
                    description: Name of the Secret, in the namespace of the DataSource.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              network:
                description: |-
                  Network is the egress the generated APIs need to reach the database;
                  the operator turns it into a NetworkPolicy.
                properties:
                  cidrs:
                    description: |-
                      CIDRs are the address blocks of the database (for a database outside
                      the cluster), for example 10.0.12.0/24.
                    items:
                      maxLength: 49
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: every entry must be a valid CIDR
                      rule: self.all(c, isCIDR(c))
                  namespaceSelector:
                    description: |-
                      NamespaceSelector narrows PodSelector to pods in the matching
                      namespaces.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  podSelector:
                    description: |-
                      PodSelector selects the database pods (for a database inside the
                      cluster). Without NamespaceSelector it matches pods in the namespace
                      of the DataSource.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  port:
                    description: Port is the TCP port of the database.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - port
                type: object
                x-kubernetes-validations:
                - message: at least one of cidrs or podSelector is required
                  rule: (has(self.cidrs) && size(self.cidrs) > 0) || has(self.podSelector)
                - message: namespaceSelector requires podSelector
                  rule: '!has(self.namespaceSelector) || has(self.podSelector)'
              secretRef:
                description: |-
                  SecretRef points to a Secret in the same namespace that holds the DSN
                  of a READ-ONLY database role. The DSN is never written inline in a
                  Kabr object.
                properties:
                  key:
                    default: dsn
                    description: Key of the Secret's data that holds the DSN.
                    maxLength: 253
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  name:
                    description: Name of the Secret, in the namespace of the DataSource.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
            required:
            - driver
            - network
            - secretRef
            type: object
          status:
            description: DataSourceStatus is the observed state of a DataSource.
            properties:
              conditions:
                description: Conditions describe the state of the DataSource (for
                  example Ready).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation last reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
