# golangci-lint configuration (v2 format).
# Pinned linter version: see .github/workflows/ci.yml (golangci-lint v2.15.0).
version: "2"

run:
  timeout: 5m
  tests: true
  # Lint tagged files too: pkg/introspect uses `//go:build integration` and
  # api/v1alpha1 has an `//go:build envtest` suite (make envtest).
  build-tags:
    - integration
    - envtest

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
    - misspell
    - errorlint
    - unconvert
  settings:
    govet:
      enable-all: true
      disable:
        # Struct field ordering for memory alignment hurts readability of the
        # canonical schema model; not worth it for catalog-sized data.
        - fieldalignment
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        # Stylistic checks already covered by revive, or too noisy:
        - -ST1000 # package comment (revive: package-comments)
        - -ST1003 # naming (revive: var-naming)
        - -ST1016 # receiver name consistency (revive: receiver-naming)
        - -ST1020 # exported func comment form (revive: exported)
        - -ST1021 # exported type comment form (revive: exported)
        - -ST1022 # exported var comment form (revive: exported)
        # Quick-fix suggestions that are a matter of taste, not correctness:
        - -QF1001 # apply De Morgan's law
        - -QF1008 # omit embedded field from selector
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unused-parameter
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      # Tests may use hardcoded demo credentials and unchecked file reads of
      # testdata; keep gosec focused on production code.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Gabrielmmorais/kabr

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
